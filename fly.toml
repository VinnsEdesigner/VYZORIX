# fly.toml — Vyzorix on Fly.io
#
# Deploy:  flyctl deploy
# Secrets: flyctl secrets set KEY=value ...   (never committed; see DOCUMENTATION/DEPLOYMENT.md)
#
# The container is built from apps/api/Dockerfile, which is a three-stage build:
# the Go binary, the Vite/pnpm frontend, and an Ubuntu runtime. The build context
# is the repo root, because the Dockerfile copies both apps/api and apps/Vyzorix_web.

app = "vyzorix"
primary_region = "jnb"

[build]
  dockerfile = "apps/api/Dockerfile.fly"

# Non-secret configuration. Everything secret (Turso token, JWT/SESSION secrets,
# the API keys, the server signing key, Resend, GitHub) is set with
# `flyctl secrets set` and never appears here.
[env]
  NODE_ENV = "production"
  PORT = "3000"
  BIND_ADDR = "0.0.0.0"

  # This image carries no frontend, so SSR is off. The API is complete without it:
  # every /v1 route, the WebSocket and GraphQL work, but GET / serves nothing.
  # Build the full apps/api/Dockerfile if the dashboard is wanted too.
  SSR_ENABLED = "false"
  SSR_AUTO_BUILD = "false"

  # Paths inside the image: /app/bin and /app/public are baked in; /data is the
  # writable directory (version.json lives here).
  VYZORIX_API_DIR = "/data"
  VYZORIX_BIN_DIR = "/app/bin"
  VYZORIX_PUBLIC_DIR = "/app/public"

  # Production uses Turso (libSQL over HTTP). TURSO_DB_URL and TURSO_AUTH_TOKEN
  # are secrets; the backend selection is not.
  DATABASE_BACKEND = "turso"
  DATABASE_MAX_OPEN_CONNS = "16"
  DATABASE_MAX_IDLE_CONNS = "8"
  DATABASE_CONN_MAX_LIFETIME = "30m"
  DATABASE_CONN_MAX_IDLE_TIME = "5m"
  DATABASE_REQUEST_TIMEOUT = "15s"
  DATABASE_HEALTH_CHECK_PERIOD = "30s"

  # Request signing. HMAC is enforced; the window is the conventional 30s.
  ENFORCE_HMAC = "true"
  HMAC_WINDOW_SECONDS = "30"
  JWT_DURATION_HOURS = "168"

  # Critical-tier commands (opening a terminal, factory reset, USB attach) normally
  # require an MFA-verified session. This deployment's operator has MFA disabled, so
  # the gate is opted out: otherwise the terminal and every critical command are
  # unreachable — a confirmation token can never be issued without MFA. Set this back
  # to "true" (or remove it) once the operator has a second factor.
  REQUIRE_MFA_FOR_CRITICAL = "false"

  # Turnstile is wired server-side but the frontend widget is not built yet, so it
  # stays off. Turning it on without the widget rejects every /v1/auth call.
  TURNSTILE_ENABLED = "false"

[http_service]
  internal_port = 3000
  force_https = true

  # The server holds a persistent WebSocket per device, so a suspended machine
  # would drop every device connection. Keep one machine always running.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
