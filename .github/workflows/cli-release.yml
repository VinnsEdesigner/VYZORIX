name: CLI Release

# Publishes the vyzorix CLI for every supported platform as release assets on a
# `cli-v*` tag. A tag is the only trigger: the released binary carries the tag as
# its version, so a binary that reports a version is always a tagged one.
#
# The repository is private, so the assets are not world-readable. That is a
# deliberate property, not an oversight: the install path is an authenticated
# download (see tooling/scripts/install-cli.sh), the same way a private npm
# package or a private Go module is consumed.

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: apps/cli/go.sum

      - name: Test
        run: go test ./...
        working-directory: apps/cli

      # The version is the tag with its `cli-` prefix removed, so the binary and
      # the release agree on one string.
      - name: Build all platforms
        working-directory: apps/cli
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#cli-}"
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"

            # CGO is off: the CLI imports only the API's generated schema types,
            # which are pure Go, so every target builds from one runner.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "dist/vyzorix-$os-$arch$ext" .
          done

          # Checksums are what the installer verifies, so a corrupted or swapped
          # download is refused rather than installed.
          cd dist && sha256sum vyzorix-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "vyzorix CLI ${GITHUB_REF_NAME#cli-}" \
            --generate-notes \
            apps/cli/dist/vyzorix-* \
            apps/cli/dist/SHA256SUMS
