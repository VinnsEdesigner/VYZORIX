  internal_api_handlers_provisioning.connectionJSON:
    properties:
      checked_at:
        type: integer
      created_at:
        type: integer
      host:
        type: string
      id:
        type: string
      last_error:
        type: string
      name:
        type: string
      status:
        type: string
      type:
        type: string
      updated_at:
        type: integer
      write_enabled:
        description: |-
          WriteEnabled reports whether the token has push scope. It is a capability flag,
          not secret material, so it is safe to return and the UI needs it to offer editing.
        type: boolean
    type: object
  internal_api_handlers_provisioning.connectionListJSON:
    properties:
      connections:
        items:
          $ref: '#/definitions/internal_api_handlers_provisioning.connectionJSON'
