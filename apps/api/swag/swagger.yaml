          schema:
            $ref: '#/definitions/internal_api_handlers_provisioning.jobJSON'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: provisioning.write required
          schema:
