      name:
        type: string
      token:
        type: string
      type:
        type: string
      write_enabled:
        description: |-
          WriteEnabled declares the token has push scope. It is a pointer so a request that
          only renames a connection cannot silently flip it either way.
        type: boolean
    type: object
