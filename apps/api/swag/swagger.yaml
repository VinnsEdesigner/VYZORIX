  internal_api_handlers_provisioning.schedulerJSON:
    properties:
      due_now:
        description: DueNow names the repositories the next tick will sync.
        items:
          type: string
        type: array
      next_due_at:
        description: NextDueAt is epoch millis of the earliest future due time; absent
          when none is due.
        type: integer
      running:
        description: |-
          Running is false when the server was started with the scheduler disabled, so a user
          is never told a timer will run when nothing is ticking.
        type: boolean
      tick_seconds:
        description: TickSeconds is how often the loop looks for due repositories.
        type: integer
    type: object
  internal_api_handlers_provisioning.secretReadinessJSON:
    properties:
      missing:
        description: |-
          Missing counts the declared keys the device does not have, so a client can badge the
