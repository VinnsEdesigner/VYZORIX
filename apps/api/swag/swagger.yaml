info:
  contact: {}
paths:
  /admin/api-keys:
    get:
      consumes:
      - application/json
      description: Lists all API keys across all users (super admin only)
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: page number (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 20)
        in: query
        name: limit
        type: integer
      - description: filter by user ID
        in: query
        name: user_id
        type: string
      - description: search by key name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: API keys with user identity
          schema:
            $ref: '#/definitions/openapi.AdminAPIKeyListResult'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: super_admin required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: List all API keys
      tags:
      - admin
  /admin/api-keys/{keyId}:
    delete:
      consumes:
      - application/json
      description: Force revokes an API key for any user (super admin only)
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: API key ID
        in: path
        name: keyId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: key revoked
          schema:
            $ref: '#/definitions/openapi.SuccessResult'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: super_admin required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "404":
          description: key not found
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Force revoke API key
      tags:
      - admin
  /admin/api-keys/stats:
    get:
      consumes:
      - application/json
      description: Returns global API key statistics (super admin only)
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: global stats
          schema:
            $ref: '#/definitions/openapi.GlobalAPIKeyStatsResult'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: super_admin required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Get global API key stats
      tags:
      - admin
  /admin/api-keys/stats/user/{userId}:
    get:
      consumes:
      - application/json
      description: Returns API key statistics for a specific user (super admin only)
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: user ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: user stats
          schema:
            $ref: '#/definitions/openapi.UserAPIKeyStatsResult'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: super_admin required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Get user API key stats
      tags:
      - admin
  /admin/api-keys/user/{userId}:
    get:
      consumes:
      - application/json
      description: Lists all API keys for a specific user (super admin only)
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: user ID
        in: path
        name: userId
        required: true
        type: string
      - description: page number (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: user API keys
          schema:
            $ref: '#/definitions/openapi.AdminAPIKeyListResult'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: super_admin required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: List user API keys
      tags:
      - admin
  /admin/clients:
    get:
      consumes:
      - application/json
      description: Returns all OAuth clients (super_admin only)
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: clients
          schema:
            $ref: '#/definitions/openapi.AdminClientListResult'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: super_admin required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: List admin clients
      tags:
      - admin
  /admin/clients/{clientId}:
    delete:
      consumes:
      - application/json
      description: Revokes a client (super_admin only)
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: client ID
        in: path
        name: clientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: client deleted
          schema:
            $ref: '#/definitions/openapi.SuccessResult'
        "400":
          description: clientId required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: super_admin required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Delete admin client
      tags:
      - admin
    get:
      consumes:
      - application/json
      description: Returns a single OAuth client by ID (super_admin only)
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: client ID
        in: path
        name: clientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: client
          schema:
            $ref: '#/definitions/openapi.AdminClientResult'
        "400":
          description: clientId required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: super_admin required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "404":
          description: client not found
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Get admin client
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Updates mutable client fields (super_admin only)
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: client ID
        in: path
        name: clientId
        required: true
        type: string
      - description: client update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/openapi.UpdateAdminClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: updated client
          schema:
            $ref: '#/definitions/openapi.AdminClientResult'
        "400":
          description: clientId required / invalid body
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: super_admin required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Update admin client
      tags:
      - admin
  /admin/clients/{clientId}/rotate-key:
    post:
      consumes:
      - application/json
      description: Rotates the signing key with a 24-hour grace period (super_admin
        only)
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: client ID
        in: path
        name: clientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: client with rotated key
          schema:
            $ref: '#/definitions/openapi.AdminClientResult'
        "400":
          description: clientId required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: super_admin required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "404":
          description: client not found
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Rotate admin client key
      tags:
      - admin
  /admin/support-bundle:
    get:
      consumes:
      - application/json
      description: Returns a diagnostic support bundle with runtime and DB stats (super_admin
        only)
      produces:
      - application/json
      responses:
        "200":
          description: support bundle
          schema:
            $ref: '#/definitions/openapi.SupportBundleResult'
        "401":
          description: not authenticated
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "403":
          description: super_admin required
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Get support bundle
      tags:
      - admin
  /admin/updates/check:
    get:
      consumes:
      - application/json
      description: Checks GitHub for the latest server release and includes usage
        stats
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: update check result
          schema:
            $ref: '#/definitions/openapi.UpdateCheckerResult'
      summary: Check for server updates
      tags:
      - usage-stats
  /alerts/rules:
    get:
      consumes:
      - application/json
      description: Returns all org-scoped alert rules with their current instance
        states
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: alert rules with instances
          schema:
            $ref: '#/definitions/openapi.AlertRuleListResult'
        "400":
          description: org context missing
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: List alert rules
      tags:
      - alerts
    post:
      consumes:
      - application/json
      description: Creates a new org-scoped alert rule. Validated before persistence
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: rule definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/openapi.AlertRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: created rule with instances
          schema:
            $ref: '#/definitions/openapi.AlertRule'
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Create alert rule
      tags:
      - alerts
  /alerts/rules/{id}:
    delete:
      consumes:
      - application/json
      description: Removes the rule and its instances
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: rule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: deleted confirmation
          schema:
            $ref: '#/definitions/openapi.DeletedResult'
        "400":
          description: not found
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Delete alert rule
      tags:
      - alerts
    get:
      consumes:
      - application/json
      description: Returns one alert rule with its current instance states
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: rule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: rule with instances
          schema:
            $ref: '#/definitions/openapi.AlertRule'
        "400":
          description: not found / forbidden
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Get alert rule
      tags:
      - alerts
    patch:
      consumes:
      - application/json
      description: Replaces a rule's mutable fields. Disabling clears its instances
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: rule ID
        in: path
        name: id
        required: true
        type: string
      - description: rule definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/openapi.AlertRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: updated rule with instances
          schema:
            $ref: '#/definitions/openapi.AlertRule'
        "400":
          description: invalid input / not found
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Update alert rule
      tags:
      - alerts
  /alerts/rules/{id}/evaluate:
    post:
      consumes:
      - application/json
      description: Triggers evaluation on the rule's metric immediately
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: rule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: evaluation result (transitioned index)
          schema:
            $ref: '#/definitions/openapi.AlertEvaluateResult'
        "500":
          description: evaluation failed
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Manually evaluate a rule
      tags:
      - alerts
  /alerts/rules/{id}/history:
    get:
      consumes:
      - application/json
      description: Transition events for an org, optionally narrowed to one rule
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: rule ID filter
        in: path
        name: id
        type: string
      - description: event limit (default 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: event entries
          schema:
            $ref: '#/definitions/openapi.AlertHistoryResult'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Alert history
      tags:
      - alerts
  /annotations:
    get:
      consumes:
      - application/json
      description: Returns org-scoped annotations, optionally filtered by tag and
        time range
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: filter by tag
        in: query
        name: tag
        type: string
      - description: result limit (default 200)
        in: query
        name: limit
        type: integer
      - description: RFC3339 lower bound
        in: query
        name: start_time
        type: string
      - description: RFC3339 upper bound
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: annotations
          schema:
            $ref: '#/definitions/openapi.AnnotationListResult'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: List annotations
      tags:
