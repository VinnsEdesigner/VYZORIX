      total:
        type: integer
    type: object
  internal_api_handlers_provisioning.repositoryRequest:
    properties:
      branch:
        type: string
      clear_webhook:
        description: |-
          ClearWebhook removes the stored webhook secret. Without it a user could replace a
          secret but never disable one, because an empty webhook_secret means "unchanged".
        type: boolean
      connection_id:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      exclude:
        items:
          type: string
        type: array
      include:
        description: |-
          Include and Exclude are the repository's scope patterns. A nil means "not
          supplied", so a PATCH that only renames cannot silently clear them.
        items:
          type: string
        type: array
      name:
        type: string
      path:
        type: string
      sync_interval_seconds:
        type: integer
      sync_target:
        type: string
      title:
        type: string
      url:
        type: string
      webhook_secret:
        description: |-
          WebhookSecret configures the HMAC secret a provider signs pushes with. It is
          write-only: no response echoes it back, and omitting it leaves the stored one alone.
        type: string
    type: object
  internal_api_handlers_provisioning.resourceJSON:
    properties:
      config_version:
        type: integer
      content_hash:
        type: string
      device_id:
        type: string
      device_last_seen:
        type: integer
      device_online:
        description: |-
          DeviceOnline is the live connection state. It is nil when there is no device (an org
          resource) or the device could not be read, so a client never shows "offline" for a
          device it simply does not know about.
        type: boolean
      device_reported_at:
        type: integer
      device_reported_version:
        type: integer
      id:
        type: string
      kind:
        description: |-
          Kind is what the resource declares, so a client can filter and group by it. An org
          resource has no device_id.
        type: string
      last_applied_at:
        type: integer
      last_error:
