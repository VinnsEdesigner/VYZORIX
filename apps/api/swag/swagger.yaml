  internal_api_handlers_inbox.claimRequest:
    properties:
      name:
        type: string
      pairingCode:
        type: string
      tierCap:
        type: integer
    required:
    - pairingCode
    type: object
  internal_api_handlers_inbox.enrollRequest:
    properties:
      apiLevel:
        type: integer
      appVersion:
        type: string
      buildId:
        type: string
      deviceClass:
        type: string
      deviceUuid:
        type: string
      manufacturer:
        type: string
      model:
        type: string
      osVersion:
        type: string
      publicKey:
        type: string
      ramBytes:
        type: integer
      secretKey:
        description: |-
          SecretKey is the device's second public key (PURPOSE_DECRYPT), which a
          secret is wrapped to. Optional: a device that does not support secrets
          omits it, and setting a secret for such a device fails rather than
          wrapping to nothing.
        type: string
      securityPatch:
        type: string
      storageBytes:
        type: integer
      supportedAbis:
        items:
          type: string
        type: array
      tierHint:
        type: integer
    required:
    - deviceUuid
    - publicKey
    type: object
  internal_api_handlers_inbox.enrollResponse:
    properties:
      deviceId:
        type: string
      expiresAt:
        type: integer
      expiresInSeconds:
        description: |-
          ExpiresInSeconds is what the device counts down. Sending the remaining time
          as well as the absolute deadline means a device with a wrong clock still
          expires its code correctly.
        type: integer
      pairingCode:
        type: string
      pairingDisplay:
        type: string
      pollIntervalSeconds:
        description: |-
          PollIntervalSeconds is how often the device should ask for its config while
          it waits to be claimed. The config normally arrives over the held WebSocket
          the moment a user claims the code, so this is the fallback for a device
          whose socket is not up — it bounds how long a claimed device can sit
          unconfigured. The server owns the value so the cadence can be tuned without
          shipping a new APK.
        type: integer
    type: object
  internal_api_handlers_provisioning.InstanceSummary:
    properties:
      boot_seed_configured:
        description: |-
          BootSeedSet reports whether a boot seed file is configured. The path itself is not
          returned: it is server filesystem layout, and a provisioning.read holder has no use
          for it — knowing where the file lives only helps an attacker who already has a write
          primitive.
        type: boolean
      connections:
        type: integer
      repositories:
        type: integer
      resources:
        type: integer
    type: object
  internal_api_handlers_provisioning.commitJSON:
    properties:
